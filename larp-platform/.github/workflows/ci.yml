name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: larp-platform/package.json
      - run: cd larp-platform && npm install
      - run: cd larp-platform && npm run lint
      - run: cd larp-platform && npm run typecheck
